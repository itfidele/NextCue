name: Package desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nextcue-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release-version.mjs
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release list --limit 1000 --json tagName,isDraft > /tmp/nextcue-releases.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = `v${version}`;
          const releases = JSON.parse(readFileSync('/tmp/nextcue-releases.json', 'utf8'));
          const published = releases.some(release => release.tagName === tag && !release.isDraft);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nbuild=${!published}\n`);
          console.log(published ? `${tag} is already published; skipping packaging.` : `Preparing ${tag}.`);
          JS
  checks:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          target: ${{ matrix.target }}
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          # Development signing only; configure Developer ID before public distribution.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nextcue-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nextcue-*
          path: installers
          merge-multiple: true
      - name: Publish complete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --prerelease --title "NextCue $RELEASE_TAG" --notes 'Desktop preview builds for macOS, Windows, and Linux. These builds are not production signed or notarized. Early preview: macOS is ad-hoc signed and not notarized; Windows is unsigned. Connected AI providers require your own eligible account and their terms apply.'
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Refusing to replace assets on a published release.' >&2
            exit 1
          fi
          find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
