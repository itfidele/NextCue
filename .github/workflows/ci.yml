name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm run build
      - run: npm --prefix browser-extension test
      - run: npx playwright install --with-deps chrome
      - name: UI tests
        shell: bash
        run: |
          npm run dev:web > /tmp/nextcue-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-diagnostics
          path: |
            test-results/
            /tmp/nextcue-vite.log
          retention-days: 7
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
